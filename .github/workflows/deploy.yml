name: Deploy SPETRO Geoportal (GitHub Pages + Cloud Run)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Permissions needed for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-cloudrun"
  cancel-in-progress: false

jobs:
  # =====================================================================
  # 1. FRONTEND: Build React/Vite SPA and Deploy to GitHub Pages (Free)
  # =====================================================================
  deploy-frontend:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'artifacts/geoportal/package.json'

      - name: Install Frontend Dependencies
        working-directory: artifacts/geoportal
        run: npm install --legacy-peer-deps

      - name: Build Production Frontend
        working-directory: artifacts/geoportal
        env:
          # Optional: If you want to bypass Cloudflare and hit Cloud Run directly during testing,
          # set VITE_API_URL in GitHub Secrets. Otherwise, it defaults to /api (Cloudflare proxy).
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/geoportal/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =====================================================================
  # 2. BACKEND: Build Docker & Deploy to Google Cloud Run (Always Free)
  # =====================================================================
  deploy-backend:
    runs-on: ubuntu-latest
    # Only run if GCP secrets are configured
    if: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Container Registry
        run: gcloud auth configure-docker --quiet

      - name: Build Docker Container
        run: |
          docker build \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/geoportal-backend:${{ github.sha }} \
            -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/geoportal-backend:latest .

      - name: Push Docker Container
        run: |
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/geoportal-backend:${{ github.sha }}
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/geoportal-backend:latest

      - name: Deploy to Google Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: geoportal-backend
          image: gcr.io/${{ secrets.GCP_PROJECT_ID }}/geoportal-backend:${{ github.sha }}
          region: ${{ secrets.GCP_REGION || 'us-central1' }}
          flags: |
            --allow-unauthenticated
            --memory=2Gi
            --cpu=1
            --min-instances=0
            --max-instances=5
            --timeout=300s
          env_vars: |
            GEE_PROJECT_ID=${{ secrets.GEE_PROJECT_ID || 'ee-petersonyang87' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GEE_SERVICE_ACCOUNT_KEY_PRIMARY=${{ secrets.GEE_SERVICE_ACCOUNT_KEY_PRIMARY }}
            GEE_SERVICE_ACCOUNT_KEY_BACKUP=${{ secrets.GEE_SERVICE_ACCOUNT_KEY_BACKUP }}
