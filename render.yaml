services:
  # Backend FastAPI Service
  - type: web
    name: geoportal-api
    env: docker
    plan: free
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: GEE_PROJECT_ID
        value: ee-petersonyang87
      - key: GEE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: GEE_SERVICE_ACCOUNT_KEY_PRIMARY
        sync: false
      - key: GEE_SERVICE_ACCOUNT_KEY_BACKUP
        sync: false
      - key: GEE_SERVICE_ACCOUNT_KEYS
        sync: false
      - key: HF_REPO_ID
        value: petersstore/blacportal-datasets
      - key: HF_TOKEN
        sync: false

  # Frontend React App (Static Site)
  - type: web
    env: static
    name: geoportal-ui
    buildCommand: pnpm install && cd artifacts/geoportal && pnpm run build
    staticPublishPath: ./artifacts/geoportal/dist/public
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: geoportal-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
